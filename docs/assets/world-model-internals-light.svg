<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">CogniSage 世界模型内部推演与动作规划</title><desc id="desc">证据编码成状态信念，状态转移预测动作后果，动作规划器在预算内选择验证动作，运行时证据回写更新状态。</desc><defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e5f3ff"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#1268d3"/><stop offset="1" stop-color="#0a9bcb"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#237acc"/></marker></defs>
  <rect x="1" y="1" width="1178" height="618" rx="28" fill="url(#b)" stroke="#b5d4ec" stroke-width="2"/><g opacity=".42" stroke="#c7ddf0"><path d="M0 110h1180M0 230h1180M0 350h1180M0 470h1180"/><path d="M140 0v620M340 0v620M540 0v620M740 0v620M940 0v620"/></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="42" y="50" fill="#1268d3" font-size="16" font-weight="700">世界模型内部：状态推演、动作评分与证据回写</text><text x="42" y="76" fill="#496b86" font-size="13">维护状态信念并选择有限预算下最值得执行的下一步，而不是直接输出“有漏洞/无漏洞”。</text></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="42" y="130" width="220" height="236" rx="16" fill="#fff" stroke="#86bbe4"/><text x="66" y="164" fill="#2678c5" font-size="12">输入证据</text><text x="66" y="195" fill="#163a5e" font-size="19" font-weight="700">Evidence Bundle</text><rect x="66" y="216" width="171" height="31" rx="5" fill="#e8f4ff"/><text x="78" y="237" fill="#315b7c" font-size="12">候选与静态证据</text><rect x="66" y="257" width="171" height="31" rx="5" fill="#e8f4ff"/><text x="78" y="278" fill="#315b7c" font-size="12">Top-k 仓库上下文</text><rect x="66" y="298" width="171" height="31" rx="5" fill="#e8f4ff"/><text x="78" y="319" fill="#315b7c" font-size="12">历史动作与运行时观察</text></g><g><rect x="310" y="130" width="220" height="236" rx="16" fill="#fff" stroke="#86bbe4"/><text x="334" y="164" fill="#2678c5" font-size="12">特征编码</text><text x="334" y="195" fill="#163a5e" font-size="19" font-weight="700">State Encoder</text><text x="334" y="225" fill="#466882" font-size="13">编码控制流、对象关系、约束、</text><text x="334" y="246" fill="#466882" font-size="13">防御分支与跨文件依赖为向量。</text><rect x="334" y="278" width="172" height="42" rx="7" fill="#e1f1ff" stroke="#8dc0e7"/><text x="346" y="304" fill="#1268d3" font-size="12">z = Encoder(evidence)</text></g><g><rect x="578" y="106" width="260" height="284" rx="20" fill="#e8f5ff" stroke="url(#c)" stroke-width="3"/><text x="604" y="144" fill="#1268d3" font-size="12">状态推演核心</text><text x="604" y="179" fill="#163a5e" font-size="21" font-weight="700">State Transition Model</text><text x="604" y="211" fill="#466882" font-size="13">预测动作后可达性、前置条件、</text><text x="604" y="234" fill="#466882" font-size="13">触发概率与不确定性如何变化。</text><rect x="604" y="257" width="208" height="58" rx="8" fill="#d8edff" stroke="#74b2e3"/><text x="620" y="282" fill="#1268d3" font-size="12">P(s[t+1] | s[t], action)</text><text x="620" y="303" fill="#315b7c" font-size="11">状态后验与不确定性估计</text></g><g><rect x="886" y="130" width="252" height="236" rx="16" fill="#fffaf4" stroke="#e2a062"/><text x="910" y="164" fill="#c86c17" font-size="12">预算式决策</text><text x="910" y="195" fill="#6f431a" font-size="19" font-weight="700">Action Planner</text><text x="910" y="225" fill="#705a45" font-size="13">估计信息增益、成本与确认收益，</text><text x="910" y="246" fill="#705a45" font-size="13">对候选动作排序并应用预算约束。</text><rect x="910" y="275" width="204" height="44" rx="7" fill="#fff0dd" stroke="#dfae78"/><text x="922" y="302" fill="#b75f10" font-size="12">score(a) = gain - cost - risk</text></g></g>
  <g fill="none" stroke="#237acc" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"><path d="M262 248h48M530 248h48M838 248h48"/></g><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="165" y="454" width="850" height="88" rx="16" fill="#fff" stroke="#9ec5e6"/><text x="194" y="486" fill="#2678c5" font-size="12">下一步验证动作</text><text x="194" y="516" fill="#163a5e" font-size="17" font-weight="700">Action Executor</text><g><rect x="405" y="475" width="116" height="40" rx="7" fill="#e4f2ff"/><text x="433" y="501" fill="#1268d3" font-size="13">局部编译</text><rect x="535" y="475" width="116" height="40" rx="7" fill="#e4f2ff"/><text x="558" y="501" fill="#1268d3" font-size="13">ASan/UBSan</text><rect x="665" y="475" width="116" height="40" rx="7" fill="#e4f2ff"/><text x="703" y="501" fill="#1268d3" font-size="13">定向 fuzz</text><rect x="795" y="475" width="116" height="40" rx="7" fill="#e4f2ff"/><text x="831" y="501" fill="#1268d3" font-size="13">LLM 复核</text></g><text x="194" y="533" fill="#496b86" font-size="11">动作观察结果作为新证据回流，重新编码并更新状态信念。</text></g>
  <path d="M1012 366v88H588" fill="none" stroke="#d57921" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#a)"/><path d="M300 542v40H152V366" fill="none" stroke="#1268d3" stroke-width="2" stroke-dasharray="5 8" marker-end="url(#a)"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="45" y="584" fill="#1268d3" font-size="11">证据回写：诊断、崩溃、未命中原因和消耗时间会影响下一轮状态预测与动作优先级。</text></g>
</svg>

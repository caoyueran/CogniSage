<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">CogniSage 端到端检测架构</title><desc id="desc">从仓库级定位到运行时证据回写的浅色蓝图。</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7f3ff"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#237acc"/></marker></defs>
  <rect x="1" y="1" width="1178" height="698" rx="28" fill="url(#b)" stroke="#b6d4ec" stroke-width="2"/><g opacity=".42" stroke="#c7ddf0"><path d="M0 103h1180M0 286h1180M0 469h1180M0 652h1180"/><path d="M135 0v700M340 0v700M545 0v700M750 0v700M955 0v700"/></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><text x="44" y="51" fill="#1268d3" font-size="16" font-weight="700">COGNISAGE / 端到端主动验证闭环</text><text x="44" y="77" fill="#496b86" font-size="13">从仓库级定位开始传递结构化证据；运行时观察结果回流，更新下一轮验证决策。</text></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="40" y="130" width="250" height="150" rx="16" fill="#fff" stroke="#86bbe4"/><text x="64" y="162" fill="#2678c5" font-size="12">01 / 仓库级定位</text><text x="64" y="194" fill="#163a5e" font-size="19" font-weight="700">Repository Locator</text><text x="64" y="220" fill="#466882" font-size="13">按 CWE 风险上下文排序文件、函数</text><text x="64" y="240" fill="#466882" font-size="13">及局部依赖，锁定 Top-k 代码簇</text></g><g><rect x="320" y="130" width="250" height="150" rx="16" fill="#fff" stroke="#86bbe4"/><text x="344" y="162" fill="#2678c5" font-size="12">02 / 候选发现</text><text x="344" y="194" fill="#163a5e" font-size="19" font-weight="700">Candidate Agents</text><text x="344" y="220" fill="#466882" font-size="13">融合 CWE 规则、LLM 语义假设</text><text x="344" y="240" fill="#466882" font-size="13">与跨文件 source-to-sink 信号</text></g><g><rect x="600" y="130" width="250" height="150" rx="16" fill="#fff" stroke="#86bbe4"/><text x="624" y="162" fill="#2678c5" font-size="12">03 / 上下文组装</text><text x="624" y="194" fill="#163a5e" font-size="18" font-weight="700">Context &amp; Slice Agent</text><text x="624" y="220" fill="#466882" font-size="13">构建局部函数簇、调用边、对象关系</text><text x="624" y="240" fill="#466882" font-size="13">以及防御分支，补足可达性条件</text></g><g><rect x="880" y="130" width="260" height="150" rx="16" fill="#e7f4ff" stroke="#287bd0" stroke-width="2"/><text x="904" y="162" fill="#1268d3" font-size="12">04 / 主动推演</text><text x="904" y="194" fill="#163a5e" font-size="19" font-weight="700">World Model</text><text x="904" y="220" fill="#466882" font-size="13">预测可达性、约束、漏洞状态置信度</text><text x="904" y="240" fill="#466882" font-size="13">并以信息增益选择最优验证动作</text></g></g>
  <g fill="none" stroke="#237acc" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"><path d="M290 205h30M570 205h30M850 205h30M1010 280v72H515v28M735 435h70"/></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="235" y="380" width="280" height="150" rx="16" fill="#fffaf4" stroke="#e2a062"/><text x="259" y="412" fill="#c86c17" font-size="12">05 / 运行时验证</text><text x="259" y="444" fill="#6f431a" font-size="19" font-weight="700">Runtime Executor</text><text x="259" y="470" fill="#705a45" font-size="13">生成局部编译簇、harness 与种子语料</text><text x="259" y="490" fill="#705a45" font-size="13">执行 ASan、UBSan 与定向 fuzz</text></g><g><rect x="805" y="380" width="280" height="150" rx="16" fill="#fff" stroke="#86bbe4"/><text x="829" y="412" fill="#2678c5" font-size="12">06 / 证据融合与报告</text><text x="829" y="444" fill="#163a5e" font-size="18" font-weight="700">Evidence &amp; Report Agent</text><text x="829" y="470" fill="#466882" font-size="13">融合静态、仓库、模型与运行时证据</text><text x="829" y="490" fill="#466882" font-size="13">输出可审计的最终漏洞状态与报告</text></g></g>
  <path d="M945 530v65H165V280" fill="none" stroke="#1268d3" stroke-width="2" stroke-dasharray="5 8" marker-end="url(#a)"/><g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="270" y="594" width="640" height="40" rx="20" fill="#e3f1ff" stroke="#9bc7e9"/><circle cx="298" cy="614" r="5" fill="#1268d3"/><text x="315" y="618" fill="#315b7c" font-size="12">反馈闭环：确认结果与失败类别回流，更新下一轮的定位排序与验证策略。</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">CogniSage 主动世界模型</title><desc id="desc">候选信号和仓库上下文进入世界模型，输出验证计划并由运行时证据回写。</desc>
  <defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e4f2ff"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#1268d3"/><stop offset="1" stop-color="#0a9bcb"/></linearGradient></defs>
  <rect x="1" y="1" width="758" height="618" rx="30" fill="url(#b)" stroke="#a9cce9" stroke-width="2"/>
  <g opacity=".46" stroke="#b8d7ef"><path d="M40 94H720M40 204H720M40 314H720M40 424H720M40 534H720"/><path d="M70 35v550M190 35v550M310 35v550M430 35v550M550 35v550M670 35v550"/></g>
  <g fill="none" stroke="#2583d4" stroke-width="2" stroke-dasharray="8 8"><path d="M185 157C270 157 286 218 338 253M570 157C510 157 487 218 422 253M381 358C381 407 270 411 185 468M381 358C381 407 491 411 570 468"/><path d="M190 494C275 569 493 569 566 494" stroke="#d87922"/></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="49" y="92" width="184" height="104" rx="14" fill="#fff" stroke="#83b9e4"/><text x="70" y="123" fill="#236cb5" font-size="12">候选信号</text><text x="70" y="153" fill="#173b61" font-size="20" font-weight="700">风险假设</text><text x="70" y="177" fill="#466782" font-size="12">规则 / LLM / 跨文件</text></g><g><rect x="527" y="92" width="184" height="104" rx="14" fill="#fff" stroke="#83b9e4"/><text x="548" y="123" fill="#236cb5" font-size="12">仓库上下文</text><text x="548" y="153" fill="#173b61" font-size="20" font-weight="700">局部代码簇</text><text x="548" y="177" fill="#466782" font-size="12">Top-k / 对象图 / 调用</text></g></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><circle cx="380" cy="306" r="104" fill="#edf7ff" stroke="url(#c)" stroke-width="3"/><circle cx="380" cy="306" r="78" fill="none" stroke="#88bfe8" stroke-dasharray="4 8"/><circle cx="380" cy="306" r="52" fill="#dcefff" stroke="#1268d3"/><text x="380" y="287" text-anchor="middle" fill="#316b9f" font-size="13">世界模型</text><text x="380" y="315" text-anchor="middle" fill="#1268d3" font-size="19" font-weight="700">状态推演</text><text x="380" y="338" text-anchor="middle" fill="#496d87" font-size="12">可达性 / 约束 / 置信度</text></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="49" y="438" width="184" height="104" rx="14" fill="#fff" stroke="#df9a5a"/><text x="70" y="469" fill="#c66a16" font-size="12">动作计划</text><text x="70" y="499" fill="#8d5018" font-size="20" font-weight="700">验证预算</text><text x="70" y="523" fill="#466782" font-size="12">编译 / harness / LLM 复核</text></g><g><rect x="527" y="438" width="184" height="104" rx="14" fill="#fff" stroke="#df9a5a"/><text x="548" y="469" fill="#c66a16" font-size="12">运行时证据</text><text x="548" y="499" fill="#8d5018" font-size="20" font-weight="700">观察结果</text><text x="548" y="523" fill="#466782" font-size="12">ASan / UBSan / fuzz 轨迹</text></g></g>
  <g font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><rect x="225" y="570" width="310" height="27" rx="13" fill="#e6f3ff" stroke="#9bc7e9"/><circle cx="246" cy="583" r="5" fill="#1268d3"/><text x="262" y="587" fill="#315b7c" font-size="11">证据回写，更新下一轮动作排序</text></g>
</svg>
